services:
  app:
    build: .
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      PUBLIC_URL: ${PUBLIC_URL:-}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://host.docker.internal:3001}
      GROQ_API_KEY: ${GROQ_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
